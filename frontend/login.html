<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TaskFlow AI</title>
    <meta name="description" content="Sign in to your TaskFlow AI workspace for intelligent task management.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo-box">T</div>
            <span>TaskFlow AI</span>
        </div>

        <div class="auth-header">
            <h1>Sign in to workspace</h1>
            <p>Enter your credentials to access your daily tasks</p>
        </div>

        <form id="login-form">
            <div class="form-group" id="email-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="alex@taskflow.io" required autocomplete="email">
                <div class="form-error">Please enter a valid email address.</div>
            </div>

            <div class="form-group" id="password-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <div class="form-error">Password is required.</div>
            </div>

            <p id="error-message" style="display:none; color: var(--danger); font-size: 13px; margin-bottom: 16px; text-align: center; font-weight: 500;"></p>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 40px; margin-top: 8px;">
                <span>Sign In</span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html" style="font-weight: 600;">Create an account</a>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
