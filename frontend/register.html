<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TaskFlow AI</title>
    <meta name="description" content="Create your TaskFlow AI workspace account for intelligent task tracking.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo-box">T</div>
            <span>TaskFlow AI</span>
        </div>

        <div class="auth-header">
            <h1>Create workspace account</h1>
            <p>Start organizing your tasks with minimal cognitive load</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="Alex Morgan" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="alex@taskflow.io" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password (min 8 characters)</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
            </div>

            <p id="error-message" style="display:none; color: var(--danger); font-size: 13px; margin-bottom: 16px; text-align: center; font-weight: 500;"></p>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 40px; margin-top: 8px;">
                <span>Create Workspace</span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html" style="font-weight: 600;">Sign in</a>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
