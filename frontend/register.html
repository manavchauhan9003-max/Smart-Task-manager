<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TaskFlow AI</title>
    <meta name="description" content="Create your TaskFlow AI workspace account. Your day, organized intelligently.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px;">
    <div style="width: 100%; max-width: 400px;">
        <!-- Brand Header -->
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: var(--accent); color: #FFFFFF; border-radius: var(--radius-sm); font-weight: 700; font-size: 18px; margin-bottom: 12px;">T</div>
            <h1 style="font-size: 22px; font-weight: 700; color: var(--text);">TaskFlow AI</h1>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Your day, organized intelligently.</p>
        </div>

        <!-- Auth Card Container -->
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-md);">
            <h2 style="font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px;">Create workspace account</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;">Start organizing your tasks with minimal cognitive load</p>

            <form id="register-form" onsubmit="handleRegisterSubmit(event)">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-input" placeholder="alex@taskflow.io" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password (min 8 characters)</label>
                    <div class="input-with-action">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                        <button type="button" class="input-action-btn" id="toggle-pw-btn" onclick="togglePasswordVisibility('password', 'pw-icon')" title="Toggle password visibility">
                            <svg id="pw-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div id="error-message" style="display: none; color: var(--danger); font-size: 13px; margin-bottom: 16px; font-weight: 500;"></div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; height: 42px; margin-top: 8px;">
                    <span>Create Account</span>
                </button>
            </form>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 13px; color: var(--text-secondary);">
                Already have an account? <a href="login.html" style="font-weight: 600; color: var(--accent);">Sign in</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;

            const isPw = input.type === "password";
            input.type = isPw ? "text" : "password";

            if (isPw) {
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        }
    </script>
</body>
</html>
